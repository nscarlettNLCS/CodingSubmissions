<script>
/* Show any error on screen instead of failing silently */
function __pwFatal(m) {
  var d = document.getElementById('pwFatal');
  if (!d) {
    d = document.createElement('div'); d.id = 'pwFatal';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c2362b;color:#fff;padding:8px 16px;font:14px/1.4 system-ui,sans-serif;z-index:100;white-space:pre-wrap';
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent = 'Something went wrong: ' + m;
}
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  __pwFatal(e.message + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : ''));
});
</script>

<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1c2230;--muted:#667085;--line:#dde2ea;--accent:#2b63d9;--err:#c2362b;--ok:#1f8a4c;--warn:#b7791f;--redbg:#fde2df;--greenbg:#dcf3e5;--amberbg:#fdf0d5;--bluebg:#e8effd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:#aab3c2}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}

a{color:var(--accent)}
.hidden{display:none!important}
.view{min-height:100%}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:650;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.spacer{flex:1}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h2.group{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;font-size:16px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.green{background:var(--greenbg);color:var(--ok)}
.chip.red{background:var(--redbg);color:var(--err)}
.chip.amber{background:var(--amberbg);color:#8a5a0b}
.chip.blue{background:var(--bluebg);color:var(--accent)}
.card .cm{margin-top:6px;font-size:13px;background:var(--bluebg);border-radius:6px;padding:5px 8px;color:#23407e}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
#loadingView{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}

#work header .title{font-weight:650;font-size:16px}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:150px}
.save .dot{width:8px;height:8px;border-radius:50%;background:#b8c0cc}
.save.saved .dot{background:var(--ok)}
.save.saving .dot{background:var(--accent)}
.save.offline{color:var(--err)}
.save.offline .dot{background:var(--err)}
.pystat{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pystat .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pystat.ready .dot{background:var(--ok)}
.banner{padding:8px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.banner.info{background:var(--bluebg);color:#23407e}
.banner.done{background:var(--greenbg);color:#14532d}
.banner.stop{background:var(--amberbg);color:#6b4608}
main.grid{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding:12px 16px 4px;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.pane h3 button{padding:2px 8px;font-size:12px;text-transform:none;letter-spacing:0}
details.task{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:34vh;overflow:auto;flex-shrink:0}
.left>.comment{flex-shrink:0}
details.task summary{padding:8px 12px;cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
details.task .body{padding:0 14px 12px;white-space:pre-wrap;font-size:14.5px}
.comment{background:var(--bluebg);border:1px solid #c9d8f7;border-radius:10px;padding:8px 12px;font-size:14px;white-space:pre-wrap;color:#23407e}
.comment b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.editorPane{flex:1;min-height:260px}
#editorWrap{flex:1;min-height:0;position:relative}
#editorWrap .CodeMirror{position:absolute;inset:0;height:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#out{flex:1;margin:0;padding:10px 12px;overflow:auto;font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#out .err{color:var(--err)}
#out .in{color:var(--accent)}

.pystat.waiting .dot{background:var(--accent);animation:blink 1s infinite}

#out .sys{color:var(--muted);font-style:italic}
#out img{max-width:100%;display:block;margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
footer{padding:4px 16px 10px;font-size:12px;color:var(--muted)}
.rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:1px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2230;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:30}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,33,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);border-radius:12px;max-width:460px;width:100%;padding:20px 22px 16px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h1{font-size:18px;margin:0 0 6px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14px;white-space:pre-wrap}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:820px){
  #work{height:auto;min-height:100%}
  main.grid{display:flex;flex-direction:column}
  .left{min-height:auto}
  .editorPane{flex:none;height:380px}
  main.grid>.pane{flex:none;height:280px}
}

<script>
(function () {
var FORMAT = PWCore.FORMAT, initChain = PWCore.initChain, nextChain = PWCore.nextChain, replayText = PWCore.replayText,
    esc = PWCore.esc, fmtWhen = PWCore.fmtWhen, fmtDate = PWCore.fmtDate;
var APP_URL = <?!= JSON.stringify(appUrl) ?>;
var START_ID = <?!= JSON.stringify(startId) ?>;

var $ = function (id) { return document.getElementById(id); };
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var done = false;
    var timer = setTimeout(function () {
      if (done) return; done = true;
      rej(new Error('The server did not answer (' + fn + '). Check your connection and reload.'));
    }, 60000);
    var r = google.script.run
      .withSuccessHandler(function (v) { if (done) return; done = true; clearTimeout(timer); res(v); })
      .withFailureHandler(function (e) { if (done) return; done = true; clearTimeout(timer); rej(e); });
    r[fn].apply(r, args);
  });
}
function errMsg(e) {
  var m = (e && e.message) || String(e);
  if (m.indexOf('NOAUTH') >= 0) return 'Could not identify your Google account. Make sure you are signed in to Chrome with your school account, then reload.';
  return m.replace(/^Error:\s*/, '');
}
function showView(id) {
  ['home', 'loadingView', 'work'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); });
}
var toastTimer;
function toast(msg, ms) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2600);
}
/* modal: resolves with the index of the button pressed */
function modal(title, text, buttons) {
  buttons = buttons || [{ label: 'OK', cls: 'primary' }];
  return new Promise(function (res) {
    $('mTitle').textContent = title; $('mText').textContent = text || '';
    var row = $('mButtons'); row.innerHTML = '';
    buttons.forEach(function (b, i) {
      var el = document.createElement('button'); el.textContent = b.label; if (b.cls) el.className = b.cls;
      el.onclick = function () { $('modal').classList.add('hidden'); res(i); };
      row.appendChild(el);
    });
    $('modal').classList.remove('hidden');
    row.lastChild.focus();
  });
}
function ask(title, text, yes) {
  return modal(title, text, [{ label: 'Cancel' }, { label: yes || 'OK', cls: 'primary' }]).then(function (i) { return i === 1; });
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* ================= assignment list ================= */
var H = null;
function loadHome() {
  showView('loadingView');
  return call('getHome').then(function (h) { H = h; renderHome(); showView('home'); }, function (e) {
    showView('home'); $('list').innerHTML = '<div class="empty">' + esc(errMsg(e)) + '</div>';
  });
}
function dueText(a, now) {
  if (!a.due) return 'No deadline';
  if (a.locked) return 'Closed ' + fmtWhen(a.due);
  return (now > a.due ? 'Was due ' : 'Due ') + fmtWhen(a.due);
}
function renderHome() {
  $('who').textContent = H.name + ' · ' + H.email;
  var tl = $('teacherLink');
  tl.classList.toggle('hidden', !H.teacher);
  tl.href = APP_URL + '?view=teacher';
  var now = H.now;
  var todo = [], done = [], closed = [];
  H.assignments.forEach(function (a) {
    if (a.submitted) done.push(a); else if (a.locked) closed.push(a); else todo.push(a);
  });
  todo.sort(function (x, y) { return (x.due || 9e15) - (y.due || 9e15) || y.created - x.created; });
  done.sort(function (x, y) { return y.submitted - x.submitted; });
  closed.sort(function (x, y) { return y.due - x.due; });
  var html = '';
  if (H.teacher) html += '<div class="empty" style="margin-bottom:10px">Teacher preview: you can see every assignment here. Anything you type is saved under your own account.</div>';
  var card = function (a) {
    var chips = '';
    if (a.submitted) chips += '<span class="chip green">Submitted ' + esc(fmtDate(a.submitted)) + '</span>';
    else if (a.locked) chips += '<span class="chip">Closed</span>';
    else if (a.due && now > a.due) chips += '<span class="chip red">Overdue</span>';
    else if (a.started) chips += '<span class="chip blue">In progress</span>';
    else chips += '<span class="chip">Not started</span>';
    if (H.teacher && !a.visible) chips += '<span class="chip amber">Hidden from students</span>';
    return '<button class="card" data-id="' + esc(a.id) + '"><div class="t">' + esc(a.title) + '</div>' +
      '<div class="meta"><span>' + esc(a.cls) + '</span><span>' + esc(dueText(a, now)) + '</span>' + chips + '</div>' +
      (a.comment ? '<div class="cm">💬 ' + esc(a.comment.length > 140 ? a.comment.slice(0, 140) + '…' : a.comment) + '</div>' : '') + '</button>';
  };
  var group = function (title, list) {
    if (!list.length) return '';
    return '<h2 class="group">' + title + '</h2>' + list.map(card).join('');
  };
  html += group('To do', todo) + group('Submitted', done) + group('Closed', closed);
  if (!H.assignments.length) {
    html += '<div class="empty">' + (H.inClass || H.teacher ? 'No assignments yet.' :
      'You are not on any class list yet. Ask your teacher to add <b>' + esc(H.email) + '</b>.') + '</div>';
  }
  $('list').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (el) {
    el.onclick = function () { openWork(el.getAttribute('data-id')); };
  });
}

/* ================= editor ================= */
var cm = CodeMirror($('editorWrap'), {
  mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, matchBrackets: true, readOnly: 'nocursor',
  extraKeys: {
    Tab: function (c) { if (c.somethingSelected()) c.indentSelection('add'); else c.replaceSelection('    ', 'end', '+input'); },
    'Shift-Tab': function (c) { c.indentSelection('subtract'); },
    'Ctrl-Enter': function () { run(); }, 'Cmd-Enter': function () { run(); },
    'Ctrl-S': function () { flush(); }, 'Cmd-S': function () { flush(); }
  }
});

var W = null;          // the open assignment
var silent = false;    // true while the page itself changes the text
var lastClip = null;   // last text copied/cut inside the editor
var running = false;

function addEvent(ev) { W.S.events.push(ev); W.S.chain = nextChain(W.S.chain, ev); W.pending.push(ev); }
function push(ev) {
  if (!W || W.readOnly) return;
  addEvent(ev);
  backupSoon();
  scheduleFlush();
  if (!flushP) setSave('dirty');
}
function setDoc(text) {
  silent = true; cm.setValue(text); cm.clearHistory(); silent = false;
}

function mapOrigin(o) {
  if (!o) return 'x';
  if (o === 'paste') return 'p';
  if (o === 'undo' || o === 'redo') return 'u';
  if (o === 'drag') return 'm';
  if (o === 'cut' || o === '+delete') return 'd';
  if (o === 'setValue') return 's';
  if (o[0] === '+' || o[0] === '*') return 't';
  return 'x';
}
cm.on('beforeChange', function (c, ch) {
  if (silent || !W || W.readOnly) return;
  var i = c.indexFromPos(ch.from), j = c.indexFromPos(ch.to);
  var s = ch.text.join('\n');
  var o = mapOrigin(ch.origin);
  if (o === 'p' || ch.origin === 'drop') {
    var internal = s.length < 3 || s === lastClip || c.getValue().indexOf(s) >= 0;
    if (!internal && W.a.nopaste) {
      ch.cancel();
      toast('Pasting from outside the editor is turned off for this task.');
      return;
    }
    o = internal ? 'q' : 'p';
  }
  push(['e', Date.now(), i, j - i, s, o]);
});
function recordClip(c) {
  if (!W || W.readOnly) return;
  var from, to;
  if (c.somethingSelected()) { from = c.getCursor('from'); to = c.getCursor('to'); }
  else {
    var l = c.getCursor().line;
    from = { line: l, ch: 0 };
    to = l + 1 < c.lineCount() ? { line: l + 1, ch: 0 } : { line: l, ch: c.getLine(l).length };
  }
  var i = c.indexFromPos(from), j = c.indexFromPos(to);
  lastClip = c.getRange(from, to);
  push(['c', Date.now(), i, j - i]);
}
cm.on('copy', recordClip);
cm.on('cut', recordClip);

/* leaving the page */
var away = false;
function goAway() { if (!W || W.readOnly || away || promptOpen) return; away = true; push(['a', Date.now()]); }
function comeBack() { if (!W || !away) return; away = false; push(['b', Date.now()]); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { goAway(); backupNow(); flush(); } else comeBack();
});
window.addEventListener('blur', goAway);
window.addEventListener('focus', comeBack);
window.addEventListener('pagehide', function () { backupNow(); });

/* ---------- local backup of unsaved changes ---------- */
function bkKey(w) { return 'pyws:' + w.id + ':' + w.email; }
function backupNow(w) {
  w = w || W;
  if (!w) return;
  try {
    if (w.pending.length && !w.readOnly) localStorage.setItem(bkKey(w), JSON.stringify({ lastSeq: w.lastSeq, confirmed: w.confirmed, pending: w.pending }));
    else localStorage.removeItem(bkKey(w));
  } catch (e) {}
}
var bkTimer = null;
function backupSoon() { clearTimeout(bkTimer); bkTimer = setTimeout(function () { backupNow(); }, 1000); }
function readBackup(w) {
  try { return JSON.parse(localStorage.getItem(bkKey(w)) || 'null'); } catch (e) { return null; }
}

/* ---------- saving to the school account ---------- */
var flushP = null, flushTimer = null, retryMs = 5000;
function scheduleFlush(ms) {
  if (flushTimer || !W) return;
  flushTimer = setTimeout(function () { flushTimer = null; flush(); }, ms == null ? 15000 : ms);
}
function statsOf(w) {
  var s = { runs: 0, errors: 0, lastErr: '', pastes: 0, pasted: 0, events: w.S.events.length, lines: 0 };
  w.S.events.forEach(function (ev) {
    if (ev[0] === 'r') { s.runs++; if (!ev[2]) { s.errors++; s.lastErr = ev[3]; } else s.lastErr = ''; }
    else if (ev[0] === 'e' && ev[5] === 'p') { s.pastes++; s.pasted += ev[4].length; }
  });
  s.lines = w === W ? cm.lineCount() : 0;
  return s;
}
function setSave(state) {
  var el = $('saveState');
  el.className = 'save ' + state;
  $('saveText').textContent = {
    saved: 'All changes saved', dirty: 'Unsaved changes', saving: 'Saving…',
    offline: 'Not saved yet — retrying', readonly: '', idle: ''
  }[state] || '';
}
function flush() {
  if (flushP) return flushP;
  var w = W;
  if (!w || w.readOnly || !w.pending.length) return Promise.resolve(true);
  clearTimeout(flushTimer); flushTimer = null;
  var batch = w.pending.slice(0, 4000);
  var chainAfter = w.confirmed;
  for (var i = 0; i < batch.length; i++) chainAfter = nextChain(chainAfter, batch[i]);
  if (w === W) setSave('saving');
  flushP = call('saveWork', w.id, { seq: w.lastSeq + 1, baseChain: w.confirmed, chainAfter: chainAfter, events: batch, stats: statsOf(w) })
    .then(function (r) {
      if (r && r.ok) {
        w.pending.splice(0, batch.length);
        w.lastSeq = r.lastSeq;
        w.confirmed = chainAfter;
        retryMs = 5000;
        backupNow(w);
        if (w === W) {
          setSave(w.pending.length ? 'dirty' : 'saved');
          if (w.pending.length) scheduleFlush(300);
        }
        return true;
      }
      rejected(w, r ? r.reason : 'error');
      return false;
    }, function () {
      if (w === W) {
        setSave('offline');
        scheduleFlush(retryMs);
        retryMs = Math.min(retryMs * 2, 60000);
      }
      return false;
    }).then(function (ok) { flushP = null; return ok; });
  return flushP;
}
function flushAll() {
  var tries = 0;
  var loop = function () {
    if (!W || !W.pending.length || W.readOnly) return Promise.resolve(!W || !W.pending.length);
    if (tries++ > 10) return Promise.resolve(false);
    return flush().then(function (ok) { return ok ? loop() : false; });
  };
  return loop();
}
function rejected(w, reason) {
  if (w !== W) return;
  if (reason === 'conflict') {
    makeReadOnly('stop', 'This assignment was changed in another tab or on another computer, so this copy has stopped saving.');
    try { localStorage.removeItem(bkKey(w)); } catch (e) {}
    modal('Opened somewhere else', 'This assignment was changed in another tab or on another computer. Reload to continue from the latest version.',
      [{ label: 'Reload', cls: 'primary' }]).then(function () { openWork(w.id); });
  } else if (reason === 'submitted') {
    makeReadOnly('done', 'This assignment has already been submitted.');
  } else if (reason === 'locked') {
    makeReadOnly('stop', 'The deadline has passed — this assignment is closed. Changes made after the deadline were not saved.');
    try { localStorage.removeItem(bkKey(w)); } catch (e) {}
  } else if (reason === 'noaccess') {
    makeReadOnly('stop', 'This assignment is no longer available.');
  } else {
    setSave('offline');
    scheduleFlush(retryMs);
  }
}
function makeReadOnly(kind, text) {
  if (!W) return;
  W.readOnly = true;
  cm.setOption('readOnly', true);
  setSave('readonly');
  $('submitBtn').classList.add('hidden');
  var b = $('banner');
  b.className = 'banner ' + kind;
  b.textContent = text;
}

/* ---------- open / leave an assignment ---------- */
function openWork(id) {
  cancelInput();
  showView('loadingView');
  return call('openAssignment', id).then(function (r) {
    var S = { format: FORMAT, student: r.email, task: r.a.id, created: r.created, events: r.events.slice(), chain: '' };
    S.chain = initChain(S);
    for (var i = 0; i < S.events.length; i++) S.chain = nextChain(S.chain, S.events[i]);
    W = { id: r.a.id, a: r.a, email: r.email, teacher: r.teacher, S: S, lastSeq: r.lastSeq, confirmed: S.chain,
          pending: [], submitted: r.submitted, locked: r.locked, readOnly: false };
    away = false;
    var stopped = r.submitted || (r.locked && !r.teacher);
    var text;
    // recover changes that were made in this browser but never reached the server
    var b = readBackup(W), recovered = false;
    if (!stopped && b && b.lastSeq === W.lastSeq && b.confirmed === W.confirmed && b.pending && b.pending.length) {
      b.pending.forEach(addEvent);
      recovered = true;
    } else if (b) {
      try { localStorage.removeItem(bkKey(W)); } catch (e) {}
    }
    text = replayText(S.events);
    if (!stopped) {
      addEvent(['s', Date.now()]);
      if (W.a.starter && !S.events.some(function (ev) { return ev[0] === 'e'; })) {
        addEvent(['e', Date.now(), 0, 0, W.a.starter, 's']);
        text = W.a.starter;
      }
    }
    // header and panels
    $('wTitle').textContent = W.a.title;
    $('wSub').textContent = W.a.cls + ' · ' + (W.a.due ? 'Due ' + fmtWhen(W.a.due) : 'No deadline') + (W.a.nopaste ? ' · pasting from outside is off' : '');
    $('taskBox').classList.toggle('hidden', !W.a.instructions);
    $('taskText').textContent = W.a.instructions || '';
    $('commentBox').classList.toggle('hidden', !r.comment);
    $('commentText').textContent = r.comment || '';
    $('submitBtn').classList.remove('hidden');
    $('submitBtn').disabled = false;
    var ban = $('banner');
    ban.className = 'banner hidden';
    if (r.teacher) { ban.className = 'banner info'; ban.textContent = 'Teacher preview — what you type here is saved under your own account.'; }
    $('out').textContent = '';
    setDoc(text);
    showView('work');
    cm.setOption('readOnly', false);
    cm.refresh();
    if (r.submitted) makeReadOnly('done', 'Submitted ' + fmtWhen(r.submitted) + '. Your teacher can reopen it if you need to make changes.');
    else if (r.locked && !r.teacher) makeReadOnly('stop', 'The deadline has passed — this assignment is closed.');
    else {
      setSave(W.pending.length ? 'dirty' : 'saved');
      cm.focus();
      backupNow();
      flush();
      if (recovered) toast('Recovered changes that had not been saved yet.');
    }
    try { google.script.history.replace(null, { a: W.id }); } catch (e) {}
  }, function (e) {
    return loadHome().then(function () { modal('Could not open the assignment', errMsg(e)); });
  });
}
function goHome() {
  var leave = function () {
    cancelInput();
    W = null; setDoc(''); cm.setOption('readOnly', 'nocursor');
    try { google.script.history.replace(null, {}); } catch (e) {}
    loadHome();
  };
  if (!W || W.readOnly || !W.pending.length) { leave(); return; }
  setSave('saving');
  Promise.race([flushAll(), wait(8000).then(function () { return false; })]).then(function (ok) {
    if (ok && (!W || !W.pending.length)) { leave(); return; }
    backupNow();
    ask('Some changes are not saved yet', 'They are kept in this browser and will be saved next time you open this assignment here. Leave anyway?', 'Leave')
      .then(function (y) { if (y) leave(); });
  });
}
$('backBtn').onclick = goHome;

function submitWork() {
  if (!W || W.readOnly) return;
  var w = W;
  ask('Submit this assignment?', 'Your teacher will see it as handed in. You can’t change it after submitting unless your teacher reopens it.', 'Submit')
    .then(function (yes) {
      if (!yes || w !== W) return;
      push(['u', Date.now()]);
      $('submitBtn').disabled = true;
      return flushAll().then(function (ok) {
        if (w !== W || w.readOnly) return;
        if (!ok || w.pending.length) {
          $('submitBtn').disabled = false;
          modal('Not submitted', 'Your latest changes could not be saved. Check your internet connection and try again.');
          return;
        }
        return call('submitWork', w.id, w.confirmed).then(function (r) {
          if (r.ok) {
            makeReadOnly('done', 'Submitted ' + fmtWhen(r.submitted) + '. Your teacher can reopen it if you need to make changes.');
            toast('Submitted');
          } else if (r.reason === 'locked') {
            makeReadOnly('stop', 'The deadline has passed — this assignment is closed.');
          } else {
            $('submitBtn').disabled = false;
            modal('Not submitted', 'Something went wrong. Please try again.');
          }
        }, function (e) {
          $('submitBtn').disabled = false;
          modal('Not submitted', errMsg(e));
        });
      });
    });
}
$('submitBtn').onclick = submitWork;

$('clearBtn').onclick = function () { if (!inputBox) $('out').textContent = ''; };

/* ================= Python ================= */
var out = $('out');
var MAX_OUT = 200000;
function write(text, cls) {
  if (out.textContent.length > MAX_OUT) return;
  var span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  if (inputBox && inputBox.parentNode === out) out.insertBefore(span, inputBox); else out.appendChild(span);
  if (out.textContent.length > MAX_OUT) {
    var s = document.createElement('span'); s.className = 'sys';
    s.textContent = '\n[Output limit reached — further output hidden]\n'; out.appendChild(s);
  }
  out.scrollTop = out.scrollHeight;
}

/* input() typed straight into the output panel, like a terminal */
var inputBox = null, inputReject = null;
function askInline() {
  return new Promise(function (resolve, reject) {
    var box = document.createElement('input');
    box.type = 'text'; box.className = 'stdin'; box.autocomplete = 'off'; box.spellcheck = false;
    box.setAttribute('aria-label', 'Program input');
    out.appendChild(box);
    inputBox = box; inputReject = reject;
    $('pyText').textContent = 'Waiting for input — type in the output panel and press Enter';
    $('pyStat').classList.add('waiting');
    out.scrollTop = out.scrollHeight;
    box.focus();
    box.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var v = box.value;
      inputBox = null; inputReject = null;
      box.remove();
      write(v + '\n', 'in');
      $('pyText').textContent = 'Running…';
      $('pyStat').classList.remove('waiting');
      resolve(v);
    });
  });
}
function cancelInput() {
  if (!inputBox) return;
  var rej = inputReject;
  inputBox.remove(); inputBox = null; inputReject = null;
  $('pyStat').classList.remove('waiting');
  if (rej) rej(new Error('Program stopped'));
}
out.addEventListener('click', function () { if (inputBox && !window.getSelection().toString()) inputBox.focus(); });
window.__pwInput = function () { return askInline(); };

var py = null, pendingLine = '', inlineInput = false, promptOpen = false;
var dec = new TextDecoder();
function outWrite(cls) {
  return { write: function (buf) {
    var t = dec.decode(buf, { stream: true });
    write(t, cls);
    var k = t.lastIndexOf('\n');
    pendingLine = k >= 0 ? t.slice(k + 1) : pendingLine + t;
    return buf.length;
  } };
}
(function loadPy() {
  if (typeof loadPyodide !== 'function') { $('pyText').textContent = 'Python could not load'; return; }
  loadPyodide().then(function (p) {
    py = p;
    py.setStdout(outWrite(''));
    py.setStderr(outWrite('err'));
    // Fallback for browsers that cannot pause Python: the browser's own pop-up box
    py.setStdin({ stdin: function () {
      var t0 = Date.now();
      promptOpen = true;
      var v = window.prompt(pendingLine.trim() || 'Input:', '');
      promptOpen = false;
      if (v === null) {
        if (Date.now() - t0 < 50) write('\n[input() needs pop-up boxes, which this browser blocked]\n', 'err');
        return undefined;
      }
      write(v + '\n', 'in'); pendingLine = '';
      return v;
    } });
    py.runPython("import os\nos.environ['MPLBACKEND']='AGG'\nimport warnings\nwarnings.filterwarnings('ignore', message='.*non-interactive.*')\nwarnings.filterwarnings('ignore', message='.*cannot be shown.*')");
    // Modern Chrome can pause Python while the student types (WebAssembly JSPI)
    if (typeof WebAssembly !== 'undefined' && typeof WebAssembly.Suspending === 'function') {
      try {
        py.runPython([
          'import builtins, sys, js',
          'from pyodide.ffi import run_sync',
          'def _pw_input(prompt=""):',
          '    if prompt != "":',
          '        sys.stdout.write(str(prompt))',
          '    sys.stdout.flush()',
          '    return run_sync(js.__pwInput())',
          'builtins.input = _pw_input'
        ].join('\n'));
        inlineInput = true;
      } catch (e) { inlineInput = false; }
    }
    $('pyStat').classList.add('ready');
    $('pyText').textContent = 'Python ready';
    $('runBtn').disabled = false;
  }, function () {
    $('pyText').textContent = 'Python failed to load — check your connection and reload';
  });
})();
function cleanErr(m) {
  var L = String(m).split('\n'), o = [];
  for (var i = 0; i < L.length; i++) {
    var t = L[i].trim();
    if (t.indexOf('File "/lib') === 0 || t.indexOf('File "/usr') === 0) {
      while (i + 1 < L.length && L[i + 1].trim().indexOf('File') !== 0 && /^\s{4,}/.test(L[i + 1])) i++;
      continue;
    }
    if (/^File "<exec>", line \d+, in _pw_input$/.test(t)) {      // our own input() helper
      while (i + 1 < L.length && /^\s{4,}/.test(L[i + 1]) && L[i + 1].trim().indexOf('File') !== 0) i++;
      continue;
    }
    o.push(L[i].replace(/File "<exec>"/g, 'File "your code"'));
  }
  return o.join('\n').trim();
}
var FIGS = "import sys\n_imgs = []\nif 'matplotlib.pyplot' in sys.modules:\n    import io, base64\n    _plt = sys.modules['matplotlib.pyplot']\n    for _n in _plt.get_fignums():\n        _b = io.BytesIO()\n        _plt.figure(_n).savefig(_b, format='png', bbox_inches='tight')\n        _imgs.append(base64.b64encode(_b.getvalue()).decode())\n    _plt.close('all')\n_imgs\n";
function run() {
  if (!py || running || !W) return;
  running = true; $('runBtn').disabled = true;
  out.textContent = ''; pendingLine = '';
  var code = cm.getValue();
  var ok = 1, msg = '';
  $('pyText').textContent = 'Running…';
  var g = null, w = W;
  var finish = function () {
    try { if (g) g.destroy(); } catch (e) {}
    try { py.runPython('import sys\nsys.stdout.flush()\nsys.stderr.flush()'); } catch (e) {}
    try {
      var imgs = py.runPython(FIGS).toJs();
      imgs.forEach(function (b64) { var im = document.createElement('img'); im.src = 'data:image/png;base64,' + b64; out.appendChild(im); });
    } catch (e) {}
    var last = msg.split('\n').filter(Boolean).pop() || '';
    if (W === w) push(['r', Date.now(), ok, ok ? '' : last.slice(0, 200)]);
    $('pyText').textContent = 'Python ready';
    $('pyStat').classList.remove('waiting');
    running = false; $('runBtn').disabled = false;
    if (W) cm.focus();
  };
  var fail = function (e) {
    ok = 0;
    msg = /Program stopped/.test(String(e && e.message)) ? 'Program stopped.' : cleanErr((e && e.message) || e);
    write((out.textContent && !out.textContent.endsWith('\n') ? '\n' : '') + msg + '\n', 'err');
  };
  setTimeout(function () {
    py.loadPackagesFromImports(code).catch(function () {}).then(function () {
      g = py.globals.get('dict')();
      g.set('__name__', '__main__');
      if (inlineInput) return py.runPythonAsync(code, { globals: g });
      py.runPython(code, { globals: g });
    }).catch(fail).then(finish);
  }, 30);
}
$('runBtn').onclick = run;

/* ================= start ================= */
setTimeout(function () {
  if (!$('loadingView').classList.contains('hidden')) {
    $('loadingView').innerHTML = '<div style="max-width:460px;padding:20px;text-align:center">Still loading after 30 seconds.<br>Try reloading the page. If it keeps happening, check you are signed in to Chrome with your school account only.</div>';
  }
}, 30000);
if (START_ID) openWork(START_ID); else loadHome();

// for automated tests
window.__pw = { get W() { return W; }, cm: cm, flush: function () { return flush(); }, bkKey: bkKey, goAway: goAway, comeBack: comeBack };
})();
</script>
